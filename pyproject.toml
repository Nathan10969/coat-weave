[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coating_kg"
version = "0.1.0"
description = "Coating patent knowledge graph (V1.2.2)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "coating_kg team" }]
license = { text = "Proprietary" }
dependencies = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "pydantic>=2.0",
    "openai>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "click>=8.1",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
coating_kg = "coating_kg.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
