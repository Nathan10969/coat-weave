[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coat-weave"
version = "0.1.0"
description = "CoatWeave: evidence-grounded knowledge graphs for coating patents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nathan10969" }]
license = { file = "LICENSE" }
dependencies = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "pydantic>=2.0",
    "openai>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "click>=8.1",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.urls]
Homepage = "https://github.com/Nathan10969/coat-weave"
Repository = "https://github.com/Nathan10969/coat-weave"
Issues = "https://github.com/Nathan10969/coat-weave/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
coating_kg = "coating_kg.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
