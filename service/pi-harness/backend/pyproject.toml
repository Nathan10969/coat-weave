[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coat-weave-patent-service"
version = "0.2.0"
description = "Read-only Milvus patent tool backend for CoatWeave Pi Harness"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2", "pymilvus>=2.6,<3"]

[project.optional-dependencies]
tos = ["tos==2.9.2"]
models = ["sentence-transformers>=3,<6"]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patent_milvus_tool = ["tool_schema.json"]
