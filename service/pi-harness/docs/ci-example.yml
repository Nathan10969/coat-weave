# Optional workflow template: place at .github/workflows/pi-harness.yml to enable.
name: Pi Harness offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: service/pi-harness
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: service/pi-harness/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run prepare-deps
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx
      - run: python -B -m unittest discover -s service/pi-harness/backend/tests -v
        env:
          PYTHONPATH: service/pi-harness/backend/src
      - run: python -B -m unittest discover -s service/tests -p test_pi_harness_layout.py -v
