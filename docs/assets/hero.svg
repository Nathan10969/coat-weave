    <text x="47" y="172" font-size="76" font-weight="700" letter-spacing="-3.5" fill="#302b4d">CoatWeave</text>
    <rect x="52" y="198" width="84" height="6" rx="3" fill="url(#ribbon)"/>
    <text x="52" y="241" font-size="25" fill="#67526b">Read the patent.</text>
    <text x="52" y="277" font-size="25" font-weight="700" fill="#7f3562">Connect the evidence.</text>
    <text x="52" y="318" font-size="15" fill="#786676">Formulations · Processes · Tests · Results</text>
