<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">CoatWeave — coating patents into connected evidence</title>
  <desc id="desc">An original conceptual illustration combining a patent page, layered coating sample and a hyperedge connecting materials, tests, results and evidence. Coral, magenta, amber and indigo form a materials research palette.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf1"/><stop offset="1" stop-color="#f6e7df"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39345e"/><stop offset="1" stop-color="#23243f"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f17b69"/><stop offset="0.52" stop-color="#d94e8f"/><stop offset="1" stop-color="#eab958"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#f4e8dc" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="450" rx="24" fill="url(#paper)"/>
  <rect width="1200" height="450" rx="24" fill="url(#grid)"/>
  <path d="M0 424C198 374 341 460 545 409S940 373 1200 414V450H0Z" fill="#f0d8cc" opacity="0.6"/>
