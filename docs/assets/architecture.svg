<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">CoatWeave architecture — knowledge production and retrieval service</title>
  <desc id="desc">The extraction pipeline processes patent PDFs through layout, context, grounded facts and KG JSONL exports. A separate visual reconstruction path produces validated KG packs. An independent embedding job prepares PostgreSQL pgvector retrieval indexes. The service API on port 8031 calls read-only KG tools on port 8021, with model, embedding and session storage dependencies.</desc>
