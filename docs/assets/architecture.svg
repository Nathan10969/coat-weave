    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#89718a"/></marker>
    <marker id="warm-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c06a71"/></marker>
  </defs>
  <rect width="1200" height="790" rx="20" fill="#fff9f1"/>
  <g font-family="Arial,Helvetica,sans-serif">
