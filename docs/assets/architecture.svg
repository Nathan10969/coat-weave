      <rect x="915" y="107" width="249" height="137" rx="14" fill="#fcf0cf" stroke="#e7d49d"/>
    </g>
    <g fill="#8c6078" font-size="11" font-weight="700"><text x="56" y="133">INPUT</text><text x="349" y="133">LAYOUT + CONTEXT</text><text x="642" y="133">FACTS + SAMPLES</text><text x="935" y="133">KNOWLEDGE OUTPUT</text></g>
    <g fill="#36304f" font-size="20" font-weight="700"><text x="56" y="166">Patent PDF</text><text x="349" y="166">Evidence units</text><text x="642" y="166">Grounded facts</text><text x="935" y="166">KG JSONL + CSV</text></g>
    <g fill="#766575" font-size="13">
      <text x="56" y="194">Your own source documents</text><text x="56" y="217">No corpus bundled</text>
      <text x="349" y="194">MinerU API / layout cache</text><text x="349" y="217">Examples · crops · paragraphs</text>
      <text x="642" y="194">Qwen / VLM · normalization</text><text x="642" y="217">Polarity · comparison · aliases</text>
      <text x="935" y="194">Evidence-linked projection</text><text x="935" y="217">CSV is a derived view</text>
    </g>
