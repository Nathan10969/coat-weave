<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">CoatWeave pipeline</title><desc id="desc">PDF to MinerU layout to evidence units to Qwen descriptions and matching to fact extraction and canonical resolution, producing JSON and PostgreSQL records.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#14b8a6"/></marker></defs>
  <rect width="1200" height="300" rx="16" fill="#0f172a"/>
  <text x="32" y="43" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#e2e8f0">DOCUMENT → EVIDENCE → STRUCTURED FACT</text>
  <g fill="#172b3c" stroke="#33566a" stroke-width="1.5"><rect x="32" y="86" width="158" height="105" rx="12"/><rect x="222" y="86" width="158" height="105" rx="12"/><rect x="412" y="86" width="158" height="105" rx="12"/><rect x="602" y="86" width="158" height="105" rx="12"/><rect x="792" y="86" width="174" height="105" rx="12"/><rect x="998" y="86" width="170" height="105" rx="12"/></g>
  <g stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"><path d="M191 138H215M381 138H405M571 138H595M761 138H785M967 138H991"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f5f9"><text x="111" y="123">Patent PDF</text><text x="301" y="123">MinerU layout</text><text x="491" y="123">Evidence units</text><text x="681" y="123">Qwen context</text><text x="879" y="123">Fact hyperedges</text><text x="1083" y="123">Review &amp; store</text></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="13" fill="#a9c1cf"><text x="111" y="151">Your documents</text><text x="111" y="173">No corpus bundled</text><text x="301" y="151">REST / cached output</text><text x="301" y="173">Examples boundaries</text><text x="491" y="151">Figures / tables</text><text x="491" y="173">Materialize &amp; route</text><text x="681" y="151">Describe &amp; match</text><text x="681" y="173">Paragraph context</text><text x="879" y="151">Extract / resolve aliases</text><text x="879" y="173">Polarity / comparison</text><text x="1083" y="151">JSON artifacts / audit</text><text x="1083" y="173">PostgreSQL + pgvector</text></g>
  <path d="M49 232H1151" stroke="#33566a"/><text x="32" y="265" font-family="Arial,sans-serif" font-size="14" fill="#5eead4">TRACEABILITY: document · page · region · row / column · validation status</text>
  <text x="1168" y="265" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">Conceptual architecture — not a benchmark</text>
</svg>
