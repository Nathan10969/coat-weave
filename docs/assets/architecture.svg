    <path d="M160 246V294H318" fill="none" stroke="#b28398" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="329" y="268" width="835" height="83" rx="13" fill="#f6edf2" stroke="#e2ccda"/>
    <text x="349" y="293" font-size="11" font-weight="700" letter-spacing="1" fill="#a14b76">ALTERNATIVE / VISUAL RECONSTRUCTION</text>
    <g fill="#67476d" font-size="14"><text x="349" y="326">Rendered pages</text><text x="572" y="326">Agent reads evidence</text><text x="873" y="326">Validate + merge + project</text></g>
